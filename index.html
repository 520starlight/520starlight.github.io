<script>
  (function () {
    var themes = ["aqua", "starlight", "sakura", "matcha", "sunset"];
    var root = document.documentElement;
    var query = new URLSearchParams(window.location.search);
    var qTheme = query.get("theme");
    var qMode = query.get("mode");
    try {
      var t = localStorage.getItem("lli-theme");
      var m = localStorage.getItem("lli-mode");
      root.dataset.theme = themes.indexOf(qTheme) > -1
        ? qTheme
        : (themes.indexOf(t) > -1 ? t : "aqua");
      root.dataset.mode = (qMode === "dark" || qMode === "light")
        ? qMode
        : (m === "dark" || m === "light")
          ? m
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {
      root.dataset.theme = "aqua";
      root.dataset.mode = "light";
    }
    var themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) {
      themeColor.content = root.dataset.mode === "dark" ? "#081824" : "#eef9fd";
    }
  })();
</script>
